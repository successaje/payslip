[package]
name = "payslip_vault"
version = "0.1.0"
description = "Backs a company payroll token 1:1 with USDC; wrap and unwrap with no admin"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "payslip_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
